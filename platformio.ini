; ble-relay ("w2b", hostname w2b.local): transparent WiFi (TCP) <-> BLE (GATT write/indicate) relay for ESP32.

[platformio]
default_envs = TZT-ESP32-Lite, native
description = Transparent WiFi-to-BLE relay (TCP <-> GATT write/indicate) for ESP32
; Per-project core directory, git-ignored: platforms, packages and the pioarduino platform's own Python environment (penv).
core_dir = ${PROJECT_DIR}/.pio-core

[common]
fw_version = 0.4.4
; Values the firmware and lib/ (so the host tests) both need, each defined here only.
build_flags =
  -D FW_VERSION=\"${common.fw_version}\"
  ; the web server's port; the operating systems' captive portal checks use plain HTTP on 80. RuleConfig::kWebPort
  -D HTTP_PORT=80
  ; BLE connections, which NimBLE-Arduino gives the controller (at most the ESP32's 9, about 1.4 KB of heap each): one per enabled
  ; rule's device, the last for discovery. ConfigData::kMaxActiveRules is one less
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=9

; ---------------------------------------------------------------------------
; The firmware for a TZT LOLIN32 Lite clone: ESP32-D0WDQ6-V3 rev 3.1, 4 MB flash, no PSRAM.
[env:TZT-ESP32-Lite]
; pioarduino release 55.03.312: Arduino core 3.3.12 on ESP-IDF 5.5.5; another release is another tag in the URL.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = lolin32_lite
framework = arduino
; min_spiffs.csv (Arduino core): two 1920 KB OTA app slots and a 128 KB data partition "spiffs", mounted as LittleFS.
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
board_build.f_flash = 80000000L
board_build.flash_mode = qio
; Links web/*.html into the firmware image: writes $BUILD_DIR/generated/WebAssets.h before every build.
extra_scripts = pre:scripts/web_assets.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Hardware facts of this board as -D flags; every other compile-time default lives in include/BuildConfig.h.
build_flags =
  ${common.build_flags}
  -D CORE_DEBUG_LEVEL=3
  ; Arduino core log_x through ESP-IDF logging, so lib/esp32/IdfLogBridge routes them into the logger
  -D USE_ESP_IDF_LOG
  -D ARDUHAL_ESP_LOG_TAG=\"arduino\"
  ; ESP-IDF's compile-time gate for ESP_LOGx and log_x, equal to CORE_DEBUG_LEVEL; without it most files compile out all but errors
  -D LOG_LOCAL_LEVEL=3
  ; built-in LED between 3.3 V and GPIO22: active-low
  -D LED_GPIO=22
  -D LED_ACTIVE_LOW=1
  ; battery plus - 100 k - GPIO34 - 100 k - GND, 100 nF across the lower one; an ADC1 pin, optional: without BATTERY_GPIO no battery
  -D BATTERY_GPIO=34
  -D BATTERY_DIVIDER_TOP_KOHM=100
  -D BATTERY_DIVIDER_BOTTOM_KOHM=100
  ; NimBLE as central and observer only
  -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
  ; NimBLE-Arduino's own lines, printed straight to the serial port: warnings and errors; info prints one per advertisement heard
  -D CONFIG_NIMBLE_CPP_LOG_LEVEL=2
  ; the stack of AsyncTCP's task, on which every web handler and the OTA flash write run; AsyncTCP's own default is twice this
  -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
  ; profiler will be turned off on final build
  -D ENABLE_PROFILE=0
  -D PROFILER_LOG_FUNCTION=printf
; src/host/ is the native entry point, never part of the firmware.
build_src_filter = +<*> -<host/>
lib_deps =
  h2zero/NimBLE-Arduino
  ESP32Async/ESPAsyncWebServer
  ESP32Async/AsyncTCP
  bblanchon/ArduinoJson
  x-stuff/SimpleProfiler

; ---------------------------------------------------------------------------
; Host build of the platform-independent modules in lib/ and their Unity tests; needs gcc/g++ on PATH.
[env:native]
platform = native
build_flags =
  ${common.build_flags}
  -std=gnu++2b
  -Wall -Wextra
; Only the host entry point; the tests pull the lib/ modules in by #include.
build_src_filter = +<host/>
test_framework = unity
; Header-only JSON library for lib/ and its tests.
lib_deps =
  bblanchon/ArduinoJson
